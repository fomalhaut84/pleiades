name: Apps CI

# apps/finance · apps/fitness 를 서비스 CI 와 같은 단계로 돌린다 (#120 · 006 §4-4 M-3 · workflow.md 8절 apps/* 행).
# - apps/*/.github/ 는 옮기지 않는다 (isolation.md I-9) — 이 파일이 그 단계를 옮겨 적은 것이다(006 ㉖)
# - secrets 0 (I-9) · DB 는 러너 안 postgres 컨테이너뿐 (I-7)
# - 워크플로우 수준 paths 필터를 쓰지 않는다 — 필수 체크가 트리거되지 않은 PR 에서 "Expected" 로 막힌다 (006 §4-4)
# - 필수 체크(Q52 · 2026-10-01): apps-fin · apps-fit. apps-fin-test 는 서비스 CI 에 없는 추가분이라 비필수.
#   단 fin 안전 시험(도구 분류 · MCP 읽기 경로 · #655)은 apps-fin 안에서 따로 돈다 — fit 은 npm test 가 이미 apps-fit 안이다.
#   job 이름을 바꾸면 dev·main ruleset 의 required_status_checks 도 함께 바꾼다.
# - apps/* 서비스 결함으로 실패하면 고치지 않는다 (Q57) — 그 체크를 비필수로 내리고 pleiades 이슈에 기록한다.
# - 세 job 모두 루트 npm ci 를 먼저 한다 (006 ㉒ · fit M-5a #132 · fin M-5b #136) — apps/* 가 file:../../packages/notify 를 참조하고
#   packages/notify/dist 는 루트 prepare 만 만든다. 루트 package-lock.json 은 fit next build 의 workspace root 추론에도 쓰인다(006 ㉒).
# - 그다음 packages/chat 설치·빌드(009 D-1 · #345) — 서버 deploy.sh 1단계와 같은 순서. 앱이 chat 을 쓰기 전에도 그 단계가 CI 에서 돈다.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fin:
    name: apps-fin
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pleiades_fin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pleiades_fin
    defaults:
      run:
        working-directory: apps/finance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x  # 서버와 같다 · yahoo-finance2 4.x 는 Node 22 이상 (#437)
          cache: 'npm'
          cache-dependency-path: |
            apps/finance/package-lock.json
            package-lock.json
            packages/chat/package-lock.json
      # 루트 npm ci → prepare(tsc -p packages/notify) → packages/notify/dist (006 ㉒ · M-5b #136)
      - name: Install root (packages/notify)
        working-directory: .
        run: npm ci
      # packages/chat 설치·빌드 — notify dist 뒤 · 앱 npm ci 앞(deploy.sh 1단계와 같은 순서 · 009 D-1 #345)
      - name: Install and build packages/chat
        working-directory: .
        run: npm --prefix packages/chat ci && npx --no-install tsc -p packages/chat
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      # #655: 도구 분류(domain.json ↔ 등록 · 쓰기 허용 호출부)와 MCP 읽기 경로 시험만 필수 job 에서 돈다 — DB 불필요.
      # 전체 fin 테스트(apps-fin-test)는 Q52 대로 비필수지만, 쓰기 도구가 읽기 쪽으로 새는 회귀는 머지를 막아야 한다.
      - name: Safety tests (도구 분류 · 읽기 경로 · 지식 prompt)
        run: npx vitest run src/lib/ai/__tests__/advisor-tools.test.ts src/mcp/__tests__/read-mode.test.ts src/mcp/__tests__/knowledge-prompt.test.ts
      - name: Build
        run: npm run build

  fin-test:
    # 서비스 fin CI 에는 테스트 단계가 없다 — 추가하되 필수로 올리지 않는다 (006 §4-4 · Q52 · Q57)
    name: apps-fin-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pleiades_fin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pleiades_fin
    defaults:
      run:
        working-directory: apps/finance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x  # 서버와 같다 · yahoo-finance2 4.x 는 Node 22 이상 (#437)
          cache: 'npm'
          cache-dependency-path: |
            apps/finance/package-lock.json
            package-lock.json
            packages/chat/package-lock.json
      # 루트 npm ci → prepare(tsc -p packages/notify) → packages/notify/dist (006 ㉒ · M-5b #136)
      - name: Install root (packages/notify)
        working-directory: .
        run: npm ci
      # packages/chat 설치·빌드 — notify dist 뒤 · 앱 npm ci 앞(deploy.sh 1단계와 같은 순서 · 009 D-1 #345)
      - name: Install and build packages/chat
        working-directory: .
        run: npm --prefix packages/chat ci && npx --no-install tsc -p packages/chat
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Test
        run: npm run test:run

  fit:
    name: apps-fit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pleiades_fit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pleiades_fit
    defaults:
      run:
        working-directory: apps/fitness
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x  # 서버 · fin 잡 · apps/fitness/.nvmrc 와 같다 (#168)
          cache: 'npm'
          cache-dependency-path: |
            apps/fitness/package-lock.json
            package-lock.json
            packages/chat/package-lock.json
      # 루트 npm ci → prepare(tsc -p packages/notify) → packages/notify/dist. 없으면 tsc TS2307 (006 ㉒ · #132)
      - name: Install root (packages/notify)
        working-directory: .
        run: npm ci
      # packages/chat 설치·빌드 — notify dist 뒤 · 앱 npm ci 앞(deploy.sh 1단계와 같은 순서 · 009 D-1 #345)
      - name: Install and build packages/chat
        working-directory: .
        run: npm --prefix packages/chat ci && npx --no-install tsc -p packages/chat
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit   # 서비스 fit CI 그대로 (= npm run typecheck)
      # 서비스 fit CI 와 같다 — vitest + 회귀 verify 스크립트 · DB 불필요 · build 앞에서 빠르게 실패
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
